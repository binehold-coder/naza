# managed by naza (.github/deploy/nginx-http.conf) — overwritten on every deploy.
# HTTP-only stage: used until the Let's Encrypt certificate for naza-couture.fr exists.

server {
    listen 80;
    listen [::]:80;
    server_name naza-couture.fr www.naza-couture.fr;

    root /var/www/naza-couture.fr;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    error_page 404 /404.html;

    # Let's Encrypt HTTP-01 (certbot --webroot), used for issuing and renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
