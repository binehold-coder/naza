# managed by naza (.github/deploy/nginx-https.conf) — overwritten on every deploy.
# Certificate: /etc/letsencrypt/live/naza-couture.fr (both names), renewed by certbot.timer,
# the renewal deploy hook reloads nginx. Canonical host: www.naza-couture.fr.

server {
    listen 80;
    listen [::]:80;
    server_name naza-couture.fr www.naza-couture.fr;
    server_tokens off;

    # Let's Encrypt HTTP-01 (certbot --webroot), used for issuing and renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://www.naza-couture.fr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name naza-couture.fr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/naza-couture.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naza-couture.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://www.naza-couture.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.naza-couture.fr;

    ssl_certificate /etc/letsencrypt/live/naza-couture.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/naza-couture.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/naza-couture.fr;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Images, fonts, css, js: cache a week (file names are not hashed, so not "immutable").
    location ~* \.(?:css|js|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
