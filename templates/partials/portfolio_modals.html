{# Portfolio modals (one per card), rendered from content/portfolio.json. #}
{% for item in items %}
<div class="portfolio-modal modal fade" id="portfolioModal-{{ item.id }}" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <div class="text-end mb-2">
                <button class="btn-close" data-bs-dismiss="modal" type="button" aria-label="{{ 'Fermer' if lang == 'fr' else 'Закрити' }}"></button>
            </div>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-12 text-center">
                        <img loading="lazy" decoding="async" class="img-fluid d-block mx-auto rounded" src="{{ asset_prefix }}{{ image_dir }}{{ item.image.file }}" width="{{ item.image.width }}" height="{{ item.image.height }}" alt="{{ item.title[lang] }}" />
                        <h3 class="text-uppercase h4 mt-3 mb-1">{{ item.title[lang] }}</h3>
{% if item.description %}
                        <p class="text-muted small">{{ item.description[lang] }}</p>
{% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endfor %}
