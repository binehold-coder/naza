<!DOCTYPE html>
<html lang="{{ 'uk' if lang == 'uk' else 'fr' }}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="{{ seo.description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{ seo.locale }}" />
    <meta property="og:site_name" content="{{ site.brand.name }}" />
    <meta property="og:title" content="{{ seo.title }}" />
    <meta property="og:description" content="{{ seo.description }}" />
    <meta property="og:image" content="{{ site.public_url }}assets/img/logo.png" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ seo.title }}" />
    <meta name="twitter:description" content="{{ seo.description }}" />
    <meta name="twitter:image" content="{{ site.public_url }}assets/img/logo.png" />
    <title>{{ seo.title }}</title>
    <link rel="icon" type="image/x-icon" href="{{ asset_prefix }}assets/favicon.ico" />
    <script src="{{ asset_prefix }}assets/vendor/fontawesome/all.min.js"></script>
    <link href="{{ asset_prefix }}css/fonts.css" rel="stylesheet" />
    <link href="{{ asset_prefix }}css/styles.css" rel="stylesheet" />
</head>
<body id="page-top">
    {% include 'partials/navbar.html' %}
    {% block content %}{% endblock %}
    {% include 'partials/footer.html' %}
    <script src="{{ asset_prefix }}assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="{{ asset_prefix }}js/scripts.js"></script>
</body>
</html>
